<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniLEARN</title>
    <link rel="icon" href="../images/img/logo (2).png" type="png">
    <link rel="stylesheet" href="../css/navigation.css">  
    <link rel="stylesheet" href="../css/sign_up.css">
</head>
<body>
     <header>
            <div class="logo_spot"  onclick="backToHome()">
            <img src="../images/img/logo (2).png" alt="Logo" class="logo_kryesore">
            <h4>UniLEARN</h4>
            </div>
        <nav id="navigation">
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="subjects.html">Subject</a></li>
                <li><a href="courses.html">Courses</a></li>
                <li><a href="books.html">Books</a></li>
            </ul>
        </nav>


    <div id="btn">
            <form action="home.html" method="get">
                <button class="search"><img src="../images/img/search.png" alt="Search" class="search-icon"></button>
            </form>
                <button onclick="loginDirection()" class="login">Log In</button>
                <button onclick="signupDirection()" class="signup">Sign Up</button>
    </div>

    
        
    </header> 
  

    <main>
      <section class="signup-section">
    <div class="signup-card">
      <div class="card-header">
        <h1>Create Account</h1>
        <p>Join UniLEARN today to track your academic growth</p>
      </div>

      <form class="signup-form">
        <div class="inputs-container">
          <div class="inputs">
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" placeholder="First Name" required>
          </div>
          <div class="inputs">
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" placeholder="Last Name" required>
          </div>
        </div>

      
        <div class="inputs-container">
          <div class="inputs">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Username" required>
          </div>
          <div class="inputs">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="student@example.com" required>
          </div>
        </div> 

        <div class="inputs-container">
          <div class="inputs">
            <label for="study-field">Study Field</label>
            <select id="study-field" required>
              <option value="">Select Field</option>
              <option value="software-engineering">SOFTWARE SYSTEM ENGINEERING (SSE)</option>
              <option value="communication-engineering">COMMUNICATION ENGINEERING(CE)</option>
              <option value="data-engineering">DATA ENGINEERING(DE)</option>
              <option value="web-programming">WEB & MOBILE PROGRAMMING (WMP)</option>
              <option value="cyber">CYBER SECURITY (CS)</option>
              <option value="graphics">GRAPHICS AND MULTIMEDIA (GM)</option>
            </select>
          </div>
          <div class="inputs">
            <label for="academicYear">Academic Year</label>
            <select id="academicYear" required>
              <option value="">Select Year</option>
              <option value="first">1st Year</option>
              <option value="second">2nd Year</option>
              <option value="third">3rd Year </option>
            </select>
          </div>
        </div>

       
        <div class="inputs-container">
          <div class="inputs">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="********" required>
          </div>
          <div class="inputs">
            <label for="confirm">Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="********" required>
          </div>
        </div>

        <div class="terms">
          <input type="checkbox" id="terms" required>
          <label for="terms">I agree to the Terms and Conditions</label>
        </div>

        <button type="submit" class="submit">Sign Up</button>
      </form>

      <div class="card-footer">
        <p>Already have an account? <a href="login.html">Login</a></p>
      </div>
    </div>
  </section>
    </main>
    
</body>
</html>
